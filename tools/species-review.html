<!doctype html><html><meta charset="utf-8"><title>Marine species review</title><style>body{margin:0;background:#244955;color:#fff;font:14px system-ui}canvas{display:block}nav{position:fixed;top:12px;left:12px;display:flex;gap:6px;z-index:2}button,select{padding:10px;border:0;border-radius:7px}output{position:fixed;bottom:12px;left:12px}#labels{position:fixed;inset:60px 0 0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);pointer-events:none}#labels span{padding:12px;align-self:end}</style><nav><select aria-label="Species" id="species"><option value="all">All species</option></select><button id="side">Side</button><button id="belly">Underside</button><button id="head">Head detail</button><button id="top">Top</button></nav><div id="labels"></div><output id="info">Loading…</output><script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createSpeciesModels} from '../src/species-models.js';
import {prepareSpeciesModel} from '../src/model-preparation.js';
import {SPECIES} from '../src/species.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#244955');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,50);
const pm=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pm.fromScene(room,.04).texture;scene.environmentIntensity=.36;
scene.add(new THREE.HemisphereLight('#e0f4ed','#687b69',1.35));const sun=new THREE.DirectionalLight('#fff3d7',2.3);sun.position.set(4,6,4);scene.add(sun);const fill=new THREE.DirectionalLight('#8dd6e5',.7);fill.position.set(-4,1,0);scene.add(fill);
const loader=new GLTFLoader(),originals=await Promise.all(['goldfish','azure','orchid'].map(n=>loader.loadAsync('/models/'+n+'-lite.glb')));
const models=[...originals.map(a=>a.scene),...createSpeciesModels()].map((body,type)=>{prepareSpeciesModel(body,type);const box=new THREE.Box3().setFromObject(body),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),g=new THREE.Group();g.add(body);body.position.sub(center);g.scale.setScalar(2.4/Math.max(size.x,size.y,size.z));scene.add(g);return g;});
const select=document.getElementById('species'),labels=document.getElementById('labels');SPECIES.forEach(sp=>{const o=document.createElement('option');o.value=sp.id;o.textContent=sp.name;select.append(o);const label=document.createElement('span');label.textContent=sp.id+' · '+sp.name;labels.append(label);});
const views={side:[4,.6,1.6],belly:[2.5,-3.7,1.2],head:[3,.3,2.3],top:[0,4.8,.4]};let angle='side';
function render(){const all=select.value==='all';labels.style.display=all?'grid':'none';renderer.setScissorTest(true);let total=0;for(let i=0;i<models.length;i++){if(!all&&i!==Number(select.value))continue;models.forEach((m,j)=>m.visible=i===j);const w=all?innerWidth/4:innerWidth,h=all?(innerHeight-60)/Math.ceil(models.length/4):innerHeight,x=all?(i%4)*w:0,y=all?(Math.ceil(models.length/4)-1-Math.floor(i/4))*h:0;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(...views[angle]);camera.lookAt(0,0,0);renderer.render(scene,camera);total+=renderer.info.render.triangles;}document.querySelector('#info').textContent=all?'Normalized views · '+total+' triangles':SPECIES[Number(select.value)].name+' · '+renderer.info.render.triangles+' triangles · '+renderer.info.render.calls+' draw calls';}
select.onchange=render;for(const key of Object.keys(views))document.getElementById(key).onclick=()=>{angle=key;render();};await renderer.compileAsync(scene,camera);render();
</script></html>
